name: Build QMK firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    strategy:
      fail-fast: false
      matrix:
        # List of keymap json files to build
        file:
          - keymap.json
    # End of json file list

    steps:
      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      - name: Checkout QMK
        uses: actions/checkout@v4.1.1
        with:
          repository: qmk/qmk_firmware
          submodules: recursive

      - name: Checkout userspace
        uses: actions/checkout@v4.1.1
        with:
          path: users/${{ github.actor }}

      - name: Build firmware
        run: qmk compile "users/${{ github.actor }}/${{ matrix.file }}"

      - name: Archive firmware
        uses: actions/upload-artifact@v4.3.0

        continue-on-error: true
        with:
          name: ${{ matrix.file }}_${{ github.actor }}
          path: |
            *.hex
            *.bin
            *.uf2

  # Every push to main publishes the built firmware as a GitHub Release, named by build time
  # (Asia/Tokyo), so a flashable file is always one click away under Releases.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v4.1.8
        with:
          path: firmware
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp="$(TZ=Asia/Tokyo date +%Y%m%d-%H%M%S)"
          ls -l firmware
          gh release create "fw-${stamp}" firmware/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Firmware ${stamp}" \
            --notes "keebio/iris/rev7 - keymap ${{ github.actor }} - commit ${{ github.sha }}"
